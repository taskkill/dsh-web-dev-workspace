<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1060" viewBox="0 0 1280 1060" role="img" aria-labelledby="title desc">
  <title id="title">设计稿 B · fast 模式：流水线视图 7 关，第 5 关验收复核自动通过、第 6 关人工确认待你拍板</title>
  <desc id="desc">快速模式下七阶段双复核流水线：第 1–5 关自动通过（验收复核备注「快速模式自动通过」），第 6 关人工确认进行中并等待 Owner 通过/打回，第 7 关发布上线锁定；右侧标注 fast 规则、双复核关系与卡内元素。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
    .h1 { font-size: 18px; font-weight: 700; fill: #0f1115; }
    .h2 { font-size: 11.5px; fill: #4e5561; }
    .sec { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; fill: #8a919c; }
    .stage { font-size: 11px; font-weight: 600; fill: #0f1115; }
    .role { font-size: 9px; fill: #8a919c; }
    .sum { font-size: 10px; fill: #4e5561; }
    .hint { font-size: 9px; fill: #8a919c; }
    .tiny { font-size: 8.5px; fill: #8a919c; }
    .pill { font-size: 9px; font-weight: 500; }
    .btn { font-size: 10.5px; font-weight: 600; }
    .link { font-size: 9.5px; fill: #4176e6; }
    .check { font-size: 9.5px; fill: #1a9e4b; }
    .tag { font-size: 8.5px; font-weight: 600; }
    .anno { font-size: 10.5px; fill: #4e5561; }
    .annob { font-size: 10.5px; font-weight: 600; fill: #0f1115; }
    .legend { font-size: 9.5px; fill: #4e5561; }
    .white { fill: #ffffff; }
  </style>

  <rect width="1280" height="1060" fill="#f7f8fa"/>
  <text x="48" y="64" class="sec">DEV WORKSPACE · 右侧栏 · 流水线视图（390px 典型宽度）· 快速模式</text>

  <!-- ======================= PANEL ======================= -->
  <rect x="48" y="84" width="392" height="920" rx="10" fill="#ffffff" stroke="#e3e8ef"/>

  <!-- toolbar -->
  <text x="58" y="108" class="stage">交付流水线</text>
  <rect x="132" y="95" width="48" height="16" rx="8" fill="#f1f3f5"/>
  <text x="156" y="106" text-anchor="middle" class="pill" fill="#8a919c">第 1 轮</text>
  <rect x="274" y="99" width="12" height="12" rx="2" fill="#0f1115"/>
