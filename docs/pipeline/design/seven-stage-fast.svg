  <text x="398" y="109" class="link">刷新</text>
  <line x1="48" y1="120" x2="440" y2="120" stroke="#e3e8ef"/>

  <!-- todo banner (approval active) -->
  <rect x="48" y="120" width="392" height="112" fill="#fdf6ea"/>
  <line x1="48" y1="232" x2="440" y2="232" stroke="#f0e3cc"/>
  <text x="58" y="142" style="font-size:11.5px;font-weight:600;fill:#0f1115">第 6 关「人工确认」待你审批</text>
  <rect x="58" y="152" width="52" height="24" rx="5" fill="#0f1115"/>
  <text x="84" y="168" text-anchor="middle" class="btn white">通过</text>
  <rect x="116" y="152" width="52" height="24" rx="5" fill="#ffffff" stroke="#d5dae1"/>
  <text x="142" y="168" text-anchor="middle" class="btn" fill="#0f1115">打回</text>
  <rect x="58" y="183" width="366" height="26" rx="5" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="66" y="200" class="hint">写清打回原因或补充要求…</text>
  <text x="58" y="223" class="hint">你只需要点通过 / 打回，其余交给团队。批准后会自动进入下一阶段。</text>

  <!-- requirement card -->
  <rect x="56" y="240" width="376" height="94" rx="7" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="64" y="256" class="tiny" style="letter-spacing:0.06em">需求标题</text>
  <text x="64" y="275" style="font-size:12px;font-weight:600;fill:#0f1115">七阶段双复核模式 v1.2.72</text>
  <text x="64" y="291" class="sum">把六阶段升级为七阶段：测试通过后新增</text>
  <text x="64" y="305" class="sum">项目经理 Agent 的「验收复核」，再由你人工确认。</text>
  <text x="64" y="319" class="sum">AI 复核给建议、你拍板；确认后才解锁发布。</text>
  <text x="64" y="332" class="link">编辑需求</text>

  <!-- stage 1 -->
  <rect x="56" y="346" width="376" height="60" rx="7" fill="#ffffff" stroke="#e3e8ef"/>
  <circle cx="71" cy="363" r="8" fill="#f1f3f5"/>
  <text x="71" y="366" text-anchor="middle" class="tiny" style="fill:#61666b">1</text>
  <text x="85" y="364" class="stage">需求分析</text>
  <text x="85" y="376" class="role">产品经理</text>
  <rect x="368" y="355" width="56" height="15" rx="7.5" fill="#f1f3f5"/>
  <text x="396" y="366" text-anchor="middle" class="pill" fill="#1a9e4b">已通过</text>
  <text x="64" y="391" class="sum">七阶段双复核需求说明，9 条验收点，范围与不做清晰</text>
  <text x="64" y="402" class="check">✓ 已通过</text>

  <!-- stage 2 -->
  <rect x="56" y="412" width="376" height="60" rx="7" fill="#ffffff" stroke="#e3e8ef"/>
  <circle cx="71" cy="429" r="8" fill="#f1f3f5"/>
  <text x="71" y="432" text-anchor="middle" class="tiny" style="fill:#61666b">2</text>
  <text x="85" y="430" class="stage">UI 设计</text>
  <text x="85" y="442" class="role">UI 设计师</text>
  <rect x="368" y="421" width="56" height="15" rx="7.5" fill="#f1f3f5"/>
  <text x="396" y="432" text-anchor="middle" class="pill" fill="#1a9e4b">已通过</text>
  <text x="64" y="457" class="sum">设计说明 + 3 张高保真 SVG，复用 ds-pipe-* / ds-wb-* 样式</text>
  <text x="64" y="468" class="check">✓ 已通过</text>

  <!-- stage 3 -->
  <rect x="56" y="478" width="376" height="60" rx="7" fill="#ffffff" stroke="#e3e8ef"/>
  <circle cx="71" cy="495" r="8" fill="#f1f3f5"/>
  <text x="71" y="498" text-anchor="middle" class="tiny" style="fill:#61666b">3</text>
  <text x="85" y="496" class="stage">开发实现</text>
  <text x="85" y="508" class="role">全栈开发</text>
  <rect x="368" y="487" width="56" height="15" rx="7.5" fill="#f1f3f5"/>
  <text x="396" y="498" text-anchor="middle" class="pill" fill="#1a9e4b">已通过</text>
  <text x="64" y="523" class="sum">7 阶段常量、迁移与闸门逻辑；npm test 全绿</text>
  <text x="64" y="534" class="check">✓ 已通过</text>

  <!-- stage 4 -->
  <rect x="56" y="544" width="376" height="60" rx="7" fill="#ffffff" stroke="#e3e8ef"/>
  <circle cx="71" cy="561" r="8" fill="#f1f3f5"/>
  <text x="71" y="564" text-anchor="middle" class="tiny" style="fill:#61666b">4</text>
  <text x="85" y="562" class="stage">测试验收</text>
  <text x="85" y="574" class="role">测试工程师</text>
  <rect x="368" y="553" width="56" height="15" rx="7.5" fill="#f1f3f5"/>
  <text x="396" y="564" text-anchor="middle" class="pill" fill="#1a9e4b">已通过</text>
  <text x="64" y="589" class="sum">42 项验收全 pass，无 fail/blocked；测试报告已出</text>
  <text x="64" y="600" class="check">✓ 已通过</text>

  <!-- stage 5 : acceptance auto-approved -->
  <rect x="56" y="610" width="376" height="112" rx="7" fill="#ffffff" stroke="#e3e8ef"/>
  <circle cx="71" cy="627" r="8" fill="#f1f3f5"/>
  <text x="71" y="630" text-anchor="middle" class="tiny" style="fill:#61666b">5</text>
  <text x="85" y="629" class="stage">验收复核</text>
  <text x="85" y="641" class="role">项目经理 Agent</text>
  <rect x="157" y="632" width="44" height="14" rx="7" fill="#eaf1fd"/>
  <text x="179" y="642" text-anchor="middle" class="tag" fill="#4176e6">AI 复核</text>
  <rect x="368" y="619" width="56" height="15" rx="7.5" fill="#f1f3f5"/>
  <text x="396" y="630" text-anchor="middle" class="pill" fill="#1a9e4b">已通过</text>
  <text x="64" y="660" class="sum">建议放行 · 阻断项 0 · 复测 3/3 通过（npm test）</text>
  <text x="64" y="678" class="link">验收复核报告</text>
  <text x="124" y="678" class="tiny" style="font-size:9px">docs/pipeline/acceptance-review.md</text>
  <rect x="64" y="690" width="126" height="17" rx="4" fill="#f1f3f5"/>
  <text x="70" y="702" class="tiny" style="fill:#61666b">快速模式自动通过</text>
  <text x="198" y="702" class="check">✓ 已通过</text>

  <!-- stage 6 : approval active -->
  <rect x="56" y="728" width="376" height="108" rx="7" fill="#ffffff" stroke="#0f1115"/>
  <circle cx="71" cy="745" r="8" fill="#f1f3f5"/>
  <text x="71" y="748" text-anchor="middle" class="tiny" style="fill:#61666b">6</text>
  <text x="85" y="747" class="stage">人工确认</text>
  <text x="85" y="759" class="role">项目经理（你）</text>
  <rect x="169" y="750" width="48" height="14" rx="7" fill="#eceef1"/>
  <text x="193" y="760" text-anchor="middle" class="tag" fill="#0f1115">人工确认</text>
  <rect x="370" y="737" width="54" height="15" rx="7.5" fill="#f1f3f5"/>
  <text x="397" y="748" text-anchor="middle" class="pill" style="font-weight:600" fill="#0f1115">进行中</text>
  <text x="64" y="780" class="sum">AI 验收复核已完成；你确认通过后才会解锁发布阶段。</text>
  <rect x="64" y="792" width="86" height="22" rx="5" fill="#ffffff" stroke="#d5dae1"/>
  <text x="107" y="807" text-anchor="middle" style="font-size:10px;font-weight:600;fill:#0f1115">发送角色提示</text>
  <text x="158" y="807" class="hint">等待你确认（在顶部待办里通过 / 打回）</text>

  <!-- stage 7 : release locked -->
  <rect x="56" y="842" width="376" height="66" rx="7" fill="#ffffff" stroke="#e3e8ef"/>
  <circle cx="71" cy="859" r="8" fill="#f1f3f5"/>
  <text x="71" y="862" text-anchor="middle" class="tiny" style="fill:#61666b">7</text>
  <text x="85" y="861" class="stage">发布上线</text>
  <text x="85" y="873" class="role">运维</text>
  <rect x="370" y="851" width="54" height="15" rx="7.5" fill="#f1f3f5"/>
  <text x="397" y="862" text-anchor="middle" class="pill" fill="#8a919c">待开始</text>
  <rect x="64" y="882" width="82" height="22" rx="5" fill="#f6f7f9" stroke="#e3e8ef"/>
  <text x="105" y="897" text-anchor="middle" style="font-size:10px;font-weight:600;fill:#b6bdc7">启动并派发</text>
  <text x="154" y="897" class="hint">需上一阶段通过后才能启动。</text>

  <!-- footer -->
  <text x="58" y="927" class="hint">需求由你下发；产品经理→UI 设计→开发→测试→AI 验收复核→你确认→运维发布。</text>
  <text x="58" y="941" class="hint">每个阶段的角色边界写在派发提示词里，评审由你在面板上把关。</text>
  <text x="58" y="960" class="hint" style="fill:#a2a8b3">真正的多角色执行由 Lead 用 spawn_teammate / team_task_* 组织；</text>
  <text x="58" y="974" class="hint" style="fill:#a2a8b3">本面板只维护阶段状态、产物与人工闸门。</text>
  <text x="58" y="996" class="tiny" style="fill:#b6bdc7">fast 模式 · 第 1 轮 · 第 5 关备注为说明灰，不是错误红</text>

  <!-- ======================= ANNOTATION ======================= -->
  <text x="470" y="122" class="h1">设计稿 B · fast 模式：验收复核自动通过，人工确认待你拍板</text>
  <text x="470" y="148" class="h2">中间五阶段提交即通过；approval 仍要你启动并确认，release 不会自动。</text>

  <text x="470" y="184" class="sec">FAST 规则</text>
  <text x="470" y="208" class="anno">· 第 1–5 关提交后自动 approved 并返回 nextStageId；「打回」语义不变，reject 仍进入 failed。</text>
  <text x="470" y="230" class="anno">· acceptance 自动通过时带「快速模式自动通过」备注，用说明灰展示，不能显示成错误红。</text>
  <text x="470" y="252" class="anno">· approval / release 永远人工：fast 下仍停在 pending / active，等你操作。</text>

  <!-- dual review diagram (fast) -->
  <text x="470" y="288" class="sec">双复核关系 · FAST 下第 5 关自动通过，第 6 关仍需你拍板</text>
  <rect x="470" y="300" width="210" height="112" rx="8" fill="#f4f8ff" stroke="#cfdcf5"/>
  <text x="486" y="324" style="font-size:10.5px;font-weight:700;fill:#0f1115">第 5 关 · 验收复核</text>
  <text x="486" y="342" style="font-size:9px;font-weight:600;fill:#4176e6">项目经理 Agent · AI 复核</text>
  <text x="486" y="361" class="anno" style="font-size:9.5px">自动通过 ✓</text>
  <text x="486" y="375" class="anno" style="font-size:9.5px">报告仍可追溯（不跳过复核）</text>
  <rect x="486" y="385" width="62" height="15" rx="7.5" fill="#e6faed"/>
  <text x="517" y="396" text-anchor="middle" class="pill" style="font-size:8.5px" fill="#1a9e4b">已通过</text>

  <rect x="750" y="300" width="210" height="112" rx="8" fill="#fdf6ea" stroke="#f0b74a" stroke-width="1.5"/>
  <text x="766" y="324" style="font-size:10.5px;font-weight:700;fill:#0f1115">第 6 关 · 人工确认</text>
  <text x="766" y="342" style="font-size:9px;font-weight:600;fill:#0f1115">项目经理（你）· 人工确认</text>
  <text x="766" y="361" class="anno" style="font-size:9.5px">进行中：等你通过 / 打回</text>
  <text x="766" y="375" class="anno" style="font-size:9.5px">AI 报告是输入，不替代你</text>
  <rect x="766" y="385" width="54" height="15" rx="7.5" fill="#f1f3f5"/>
  <text x="793" y="396" text-anchor="middle" class="pill" style="font-size:8.5px;font-weight:600" fill="#0f1115">待你确认</text>

  <rect x="1030" y="300" width="210" height="112" rx="8" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="1046" y="324" style="font-size:10.5px;font-weight:700;fill:#0f1115">第 7 关 · 发布上线</text>
  <text x="1046" y="342" style="font-size:9px;fill:#8a919c">运维</text>
  <text x="1046" y="361" class="anno" style="font-size:9.5px">仍锁定：fast 不自动通过</text>
  <text x="1046" y="375" class="anno" style="font-size:9.5px">人工确认通过后才解锁</text>
  <rect x="1046" y="385" width="46" height="15" rx="7.5" fill="#f1f3f5"/>
  <text x="1069" y="396" text-anchor="middle" class="pill" style="font-size:8.5px" fill="#8a919c">锁定</text>

  <line x1="684" y1="356" x2="742" y2="356" stroke="#b6bdc7" stroke-width="1.5"/>
  <polygon points="750,356 741,351 741,361" fill="#b6bdc7"/>
  <text x="714" y="334" text-anchor="middle" class="tiny">自动通过</text>
  <text x="714" y="347" text-anchor="middle" class="tiny">仍留报告</text>
  <line x1="964" y1="356" x2="1022" y2="356" stroke="#b6bdc7" stroke-width="1.5"/>
  <polygon points="1030,356 1021,351 1021,361" fill="#b6bdc7"/>
  <text x="994" y="334" text-anchor="middle" class="tiny">你确认后</text>
  <text x="994" y="347" text-anchor="middle" class="tiny">才解锁</text>
  <text x="470" y="434" class="sum">双复核没有被 fast 绕过：第 5 关自动通过但留下复核报告，第 6 关必须由你拍板。</text>

  <!-- fast hint tooltip -->
  <text x="470" y="474" class="sec">快速模式开关 title（pipeline.fastHint）</text>
  <rect x="470" y="486" width="770" height="52" rx="7" fill="#0f1115"/>
  <text x="486" y="507" style="font-size:10.5px;fill:#ffffff">中间五阶段（需求/设计/开发/测试/验收复核）提交后自动通过并推进；</text>
  <text x="486" y="526" style="font-size:10.5px;fill:#ffffff">只有人工确认与发布需要你点。</text>

  <text x="470" y="566" class="sec">工作台同步变化</text>
  <rect x="470" y="578" width="770" height="42" rx="7" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="486" y="604" class="anno">已完成 5/7 · 当前：人工确认 · 进行中 · 负责：项目经理（你）——「需要你处理」卡显示第 6 关待审批。</text>

  <!-- callouts aligned with cards -->
  <text x="470" y="648" class="annob">① 自动通过备注：快速模式自动通过（说明灰，非错误红）</text>
  <line x1="444" y1="644" x2="462" y2="644" stroke="#8a919c" stroke-width="1"/>
  <circle cx="444" cy="644" r="2.5" fill="#8a919c"/>

  <text x="470" y="682" class="annob">② 复核报告仍可点开，自动通过 ≠ 跳过复核</text>
  <line x1="444" y1="678" x2="462" y2="678" stroke="#4176e6" stroke-width="1"/>
  <circle cx="444" cy="678" r="2.5" fill="#4176e6"/>

  <text x="470" y="764" class="annob">③ 第 6 关进行中：通过 / 打回在顶部待办横幅</text>
  <line x1="444" y1="760" x2="462" y2="760" stroke="#b7791f" stroke-width="1"/>
  <circle cx="444" cy="760" r="2.5" fill="#b7791f"/>

  <text x="470" y="792" class="annob">④ approvalReady：你确认通过后才会解锁发布阶段</text>
  <line x1="444" y1="788" x2="462" y2="788" stroke="#8a919c" stroke-width="1"/>
  <circle cx="444" cy="788" r="2.5" fill="#8a919c"/>

  <text x="470" y="878" class="annob">⑤ 第 7 关保持锁定：fast 绝对不会自动通过 release</text>
  <line x1="444" y1="874" x2="462" y2="874" stroke="#8a919c" stroke-width="1"/>
  <circle cx="444" cy="874" r="2.5" fill="#8a919c"/>

  <!-- legend -->
  <text x="470" y="927" class="sec">颜色与语义</text>
  <rect x="470" y="941" width="10" height="10" rx="2" fill="#4176e6"/>
  <text x="486" y="950" class="legend">AI 复核（信息蓝）</text>
  <rect x="630" y="941" width="10" height="10" rx="2" fill="#0f1115"/>
  <text x="646" y="950" class="legend">人工确认（中性深色）</text>
  <rect x="810" y="941" width="10" height="10" rx="2" fill="#f59e0b"/>
  <text x="826" y="950" class="legend">待评审 / 待你确认</text>
  <rect x="960" y="941" width="10" height="10" rx="2" fill="#22c55e"/>
  <text x="976" y="950" class="legend">已通过（含自动通过）</text>

  <text x="470" y="990" class="tiny">SVG 为浅色主题 token 近似色（为静态稿可读性略带加深）；实现必须使用 --dsw-alias-* 变量。</text>
  <text x="470" y="1006" class="tiny">fast 下 approval / release 在任何情况下都不能出现「自动通过」的视觉。</text>
</svg>
