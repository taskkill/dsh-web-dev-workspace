<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">「指派给 Agent」抽屉高保真效果图（v1.2.75）</title>
  <desc id="desc">工作台右侧 608px 指派抽屉：交给谁（按角色/当前成员/新建 Agent）、任务标题、详细说明、验收标准、优先级 P1、关联流水线阶段（自动判断 + 5 个可关联阶段 + 不关联；人工确认与发布上线置灰不可选）、期望产物路径、附件 MVP 降级提示、双复核闸门提示与提交按钮。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
    .page { font-size: 20px; font-weight: 700; fill: #0f1115; }
    .h1 { font-size: 20px; font-weight: 700; fill: #0f1115; }
    .sub { font-size: 13px; fill: #61666b; }
    .label { font-size: 13px; font-weight: 600; fill: #0f1115; }
    .req { font-size: 13px; font-weight: 600; fill: #d1242f; }
    .input { font-size: 14px; fill: #0f1115; }
    .textarea { font-size: 13px; fill: #0f1115; }
    .meta { font-size: 12px; fill: #61666b; }
    .counter { font-size: 12px; fill: #61666b; }
    .tab { font-size: 13px; font-weight: 600; fill: #61666b; }
    .tab-on { font-size: 13px; font-weight: 600; fill: #0f1115; }
    .chip { font-size: 12px; fill: #0f1115; }
    .chip-on { font-size: 12px; font-weight: 600; fill: #2563eb; }
    .chip-off { font-size: 12px; fill: #61666b; }
    .seg { font-size: 13px; font-weight: 600; fill: #61666b; }
    .seg-on { font-size: 13px; font-weight: 600; fill: #ffffff; }
    .btn-p { font-size: 14px; font-weight: 600; fill: #ffffff; }
    .btn-s { font-size: 14px; font-weight: 600; fill: #0f1115; }
    .footer-hint { font-size: 12px; fill: #61666b; }
    .skeleton { fill: #e9edf2; }
    .white { fill: #ffffff; }
  </style>

  <defs>
    <filter id="drawer-shadow" x="-20%" y="0" width="140%" height="100%">
      <feDropShadow dx="-8" dy="0" stdDeviation="18" flood-color="#0f1115" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1440" height="1024" fill="#eceff3"/>

  <!-- background workbench (simplified, dimmed) -->
  <g>
    <rect x="24" y="24" width="1392" height="976" rx="12" fill="#ffffff"/>
    <rect x="24" y="24" width="1392" height="56" fill="#ffffff"/>
    <line x1="24" y1="80" x2="1416" y2="80" stroke="#e3e8ef"/>
    <circle cx="52" cy="52" r="11" fill="#0f1115"/><circle cx="52" cy="52" r="4" fill="#ffffff"/>
    <text x="72" y="57" style="font-size:14px;font-weight:600;fill:#0f1115">Dev Workspace</text>
    <text x="196" y="57" class="meta">工作区 / dsh-web-filebrowser</text>
    <rect x="24" y="80" width="212" height="920" fill="#f9fafb"/>
    <line x1="236" y1="80" x2="236" y2="1000" stroke="#e3e8ef"/>
    <rect x="36" y="120" width="188" height="36" rx="8" fill="#ffffff" stroke="#e3e8ef"/>
    <text x="70" y="144" style="font-size:13px;font-weight:600;fill:#0f1115">工作台</text>
    <text x="70" y="180" class="meta">文件</text>
    <text x="70" y="216" class="meta">搜索</text>
