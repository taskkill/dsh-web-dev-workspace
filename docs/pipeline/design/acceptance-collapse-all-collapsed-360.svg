o Sans SC, PingFang SC, sans-serif" font-size="12" font-weight="600" fill="#0F1115">交付与预览分享</text><g transform="translate(340 16) scale(0.75)"><path d="M4 6.5 8 10.5 12 6.5" fill="none" stroke="#61666B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(0 574)"><rect x="0" y="0" width="360" height="66" fill="#FAFAFB"/><rect x="0" y="0" width="360" height="1" fill="#EDEDEE"/><text x="10" y="18" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="9" font-weight="400" fill="#61666B">① 「全部收起」后：三区块 + 全部分组 + 详情都收起，选中不取消。</text><text x="10" y="31" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="9" font-weight="400" fill="#61666B">② 详情头保留状态徽标 + 选中标题 + 「详情已收起」，清单行高亮仍在。</text><text x="10" y="44" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="9" font-weight="400" fill="#61666B">③ 工具区按钮变成「全部展开」，一次恢复三区块 + 全部分组 + 详情。</text><text x="10" y="57" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="9" font-weight="400" fill="#61666B">④ 折叠偏好写 localStorage，刷新后仍是本态（选中项按现状不持久）。</text></g>
