  </g>
  <line x1="604" y1="194" x2="608" y2="194" stroke="#d5dae1" stroke-width="1.5"/>
  <!-- current : acceptance review -->
  <g>
    <rect x="608" y="146" width="128" height="98" rx="8" fill="#fffaf0" stroke="#f0b74a" stroke-width="1.5"/>
