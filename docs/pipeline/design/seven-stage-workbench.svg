    <text x="76" y="190" class="role">产品经理</text>
    <rect x="76" y="200" width="54" height="15" rx="7.5" fill="#e6faed"/>
    <text x="103" y="211" text-anchor="middle" class="pill" style="fill:#1a9e4b;font-size:8.5px">已通过</text>
  </g>
  <line x1="196" y1="194" x2="200" y2="194" stroke="#d5dae1" stroke-width="1.5"/>
  <g>
    <rect x="200" y="146" width="128" height="98" rx="8" fill="#f6fbf7" stroke="#bfe6cc"/>
    <circle cx="216" cy="164" r="7.5" fill="#e6faed"/>
    <text x="216" y="167" text-anchor="middle" class="tiny" style="fill:#1a9e4b;font-weight:700">✓</text>
    <text x="232" y="167" class="stage">UI 设计</text>
