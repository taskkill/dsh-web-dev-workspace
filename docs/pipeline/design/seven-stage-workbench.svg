<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc">
  <title id="title">工作台项目流程 7 步设计稿</title>
  <desc id="desc">工作台项目流程卡：7 个阶段横向排布，第 5 关验收复核待评审、第 6 关人工确认待开始、第 7 关发布锁定；含项目状态 4/7 与需要你处理卡片。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
    .h1 { font-size: 18px; font-weight: 700; fill: #0f1115; }
    .h2 { font-size: 11.5px; fill: #4e5561; }
    .sec { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; fill: #8a919c; }
    .stage { font-size: 11px; font-weight: 600; fill: #0f1115; }
    .role { font-size: 9px; fill: #8a919c; }
    .sum { font-size: 10.5px; fill: #4e5561; }
    .hint { font-size: 9.5px; fill: #8a919c; }
    .tiny { font-size: 8.5px; fill: #8a919c; }
    .pill { font-size: 9px; font-weight: 500; }
    .btn { font-size: 10.5px; font-weight: 600; }
    .link { font-size: 9.5px; fill: #4176e6; }
    .check { font-size: 10px; fill: #1a9e4b; }
    .note { font-size: 10.5px; fill: #4e5561; }
    .white { fill: #ffffff; }
  </style>

  <rect width="1100" height="820" fill="#f7f8fa"/>

  <text x="48" y="56" class="h1">设计稿 D · 工作台：项目流程 7 步（当前第 5 关验收复核待评审）</text>
  <text x="48" y="82" class="h2">7 步横向排布、可横向滚动、不折行；角色名区分「项目经理 Agent」与「项目经理（你）」，不新增标签；进度总数 = stages.length（7）。</text>

  <!-- ================= PROJECT FLOW CARD ================= -->
  <rect x="48" y="106" width="1004" height="212" rx="10" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="64" y="130" style="font-size:10.5px;font-weight:700;letter-spacing:0.05em;fill:#8a919c">项目流程</text>
  <rect x="132" y="116" width="48" height="16" rx="8" fill="#f1f3f5"/>
  <text x="156" y="127" text-anchor="middle" class="tiny" fill="#8a919c">第 1 轮</text>
  <text x="1036" y="130" text-anchor="end" class="link">查看流水线</text>

