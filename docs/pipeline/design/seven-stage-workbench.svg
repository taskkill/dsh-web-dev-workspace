    <text x="375" y="211" text-anchor="middle" class="pill" style="fill:#1a9e4b;font-size:8.5px">已通过</text>
  </g>
  <line x1="468" y1="194" x2="472" y2="194" stroke="#d5dae1" stroke-width="1.5"/>
  <g>
    <rect x="472" y="146" width="128" height="98" rx="8" fill="#f6fbf7" stroke="#bfe6cc"/>
    <circle cx="488" cy="164" r="7.5" fill="#e6faed"/>
    <text x="488" y="167" text-anchor="middle" class="tiny" style="fill:#1a9e4b;font-weight:700">✓</text>
    <text x="504" y="167" class="stage">测试验收</text>
    <text x="484" y="190" class="role">测试工程师</text>
    <rect x="484" y="200" width="54" height="15" rx="7.5" fill="#e6faed"/>
