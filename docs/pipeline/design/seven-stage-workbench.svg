  <!-- flow now -->
  <line x1="64" y1="260" x2="1036" y2="260" stroke="#eceef1" stroke-dasharray="4 4"/>
  <circle cx="70" cy="288" r="3.5" fill="#f59e0b"/>
  <text x="82" y="292" style="font-size:11px;font-weight:600;fill:#0f1115">当前：验收复核</text>
  <text x="216" y="292" class="hint">·</text>
  <text x="226" y="292" class="hint">待评审</text>
  <text x="280" y="292" class="hint">·</text>
  <text x="290" y="292" class="hint">负责：项目经理 Agent</text>
  <text x="1036" y="292" text-anchor="end" class="hint">实际 7×116 + 6×20 = 932px · 滚动兜底</text>

  <!-- ================= STATUS + ATTENTION CARDS ================= -->
  <rect x="48" y="340" width="490" height="150" rx="10" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="64" y="366" style="font-size:10.5px;font-weight:700;letter-spacing:0.05em;fill:#8a919c">项目状态</text>
  <text x="64" y="394" class="sum">第 1 轮 · 已完成 4/7 · 当前：验收复核</text>
  <rect x="64" y="408" width="12" height="12" rx="2" fill="#ffffff" stroke="#b6bdc7"/>
  <text x="82" y="418" class="tiny">快速模式</text>
  <text x="128" y="418" class="link">查看流水线</text>
  <text x="64" y="444" class="hint">验收复核待评审：通过后进入第 6 关人工确认；第 7 关发布仍锁定。</text>
  <text x="64" y="460" class="hint">进度总数取 stages.length（默认 7），不要写死六关。</text>
  <rect x="64" y="470" width="86" height="22" rx="5" fill="#0f1115"/>
  <text x="107" y="485" text-anchor="middle" class="btn white">打开流水线</text>

  <rect x="558" y="340" width="494" height="150" rx="10" fill="#fffaf0" stroke="#f0b74a"/>
  <text x="574" y="366" style="font-size:10.5px;font-weight:700;letter-spacing:0.05em;fill:#8a919c">需要你处理</text>
  <rect x="992" y="352" width="46" height="16" rx="8" fill="#f1f3f5"/>
  <text x="1015" y="363" text-anchor="middle" class="tiny" fill="#b7791f">1 项</text>
  <text x="574" y="392" style="font-size:11.5px;font-weight:600;fill:#0f1115">第 5 关「验收复核」待你审批</text>
  <rect x="574" y="402" width="376" height="26" rx="5" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="582" y="419" class="hint">写清打回原因或补充要求（可建议回退阶段）…</text>
  <rect x="574" y="438" width="52" height="24" rx="5" fill="#0f1115"/>
  <text x="600" y="454" text-anchor="middle" class="btn white">通过</text>
  <rect x="632" y="438" width="52" height="24" rx="5" fill="#ffffff" stroke="#d5dae1"/>
  <text x="658" y="454" text-anchor="middle" class="btn" fill="#0f1115">打回</text>
  <text x="696" y="453" class="hint">通过 → 第 6 关；打回 → 按备注回退修复</text>
  <text x="574" y="480" class="hint">fast 模式下这里只会在第 6 关（人工确认）出现；第 7 关仍需通过后发布。</text>

  <!-- ================= NOTES ================= -->
  <text x="48" y="536" class="sec">实现与视觉要点</text>
  <text x="48" y="562" class="note">· 流程条复用 .ds-wb-step / .ds-wb-steps：7 步 min-width 116px，容器 overflow-x:auto，不折行；compact 单列页面同样横向滚动。</text>
  <text x="48" y="584" class="note">· 第 5 步角色「项目经理 Agent」、第 6 步「项目经理（你）」；标签只在流水线卡出现，流程条不重复。</text>
  <text x="48" y="606" class="note">· 状态色沿用 data-status：已通过绿、待评审警示、进行中品牌色；当前步骤加 ● 当前，不只靠颜色。</text>
  <text x="48" y="628" class="note">· 工作台「需要你处理」卡沿用现有 reviewGate 文案（第 {n} 关动态计算），第 5/6 关自动正确，无需硬编码。</text>

  <text x="48" y="680" class="sec">响应式与无障碍</text>
  <text x="48" y="706" class="note">· ≤700px 或 data-compact：页面单列、按钮 34px；流程条保持横向滑动，可看到 1–3 步并滑到第 7 步。</text>
  <text x="48" y="728" class="note">· 每个步骤是 button，title 含「阶段 · 状态 · 摘要」；键盘可 Tab 到达，禁用仅用于不可点步骤。</text>
  <text x="48" y="750" class="note">· 颜色不单独表意：序号、✓、状态文字并存；深色主题走 token 自动适配。</text>

  <text x="48" y="792" class="hint">SVG 步宽 128px 为放大展示；实际 .ds-wb-step min-width 116px + 连接线 20px，7 步约 932px，1080px 内容宽可完整显示，窄屏由横向滚动兜底。</text>
</svg>
