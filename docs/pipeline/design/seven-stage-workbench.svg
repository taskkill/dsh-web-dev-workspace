    <text x="783" y="211" text-anchor="middle" class="pill" style="fill:#8a919c;font-size:8.5px">待开始</text>
  </g>
  <line x1="876" y1="194" x2="880" y2="194" stroke="#d5dae1" stroke-width="1.5"/>
  <g>
    <rect x="880" y="146" width="128" height="98" rx="8" fill="#ffffff" stroke="#e3e8ef"/>
    <circle cx="896" cy="164" r="7.5" fill="#f1f3f5"/>
    <text x="896" y="167" text-anchor="middle" class="tiny" style="fill:#61666b">7</text>
