<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1060" viewBox="0 0 1280 1060" role="img" aria-labelledby="title desc">
  <title id="title">设计稿 A · normal 模式：流水线视图 7 关，第 5 关验收复核待评审</title>
  <desc id="desc">七阶段双复核流水线侧栏视图：第 1–4 关已通过，第 5 关验收复核待评审并显示 AI 复核标签与复核报告，第 6 关人工确认与第 7 关发布上线锁定；右侧标注双复核关系与卡片要点。</desc>
