  <text x="154" y="799" class="hint">需上一阶段通过后才能启动。</text>

  <!-- stage 7 : release (locked) -->
  <rect x="56" y="834" width="376" height="66" rx="7" fill="#ffffff" stroke="#e3e8ef"/>
  <circle cx="71" cy="851" r="8" fill="#f1f3f5"/>
  <text x="71" y="854" text-anchor="middle" class="tiny" style="fill:#61666b">7</text>
  <text x="85" y="853" class="stage">发布上线</text>
  <text x="85" y="865" class="role">运维</text>
  <rect x="370" y="843" width="54" height="15" rx="7.5" fill="#f1f3f5"/>
  <text x="397" y="854" text-anchor="middle" class="pill" fill="#8a919c">待开始</text>
  <rect x="64" y="874" width="82" height="22" rx="5" fill="#f6f7f9" stroke="#e3e8ef"/>
  <text x="105" y="889" text-anchor="middle" style="font-size:10px;font-weight:600;fill:#b6bdc7">启动并派发</text>
  <text x="154" y="889" class="hint">需上一阶段通过后才能启动。</text>

  <!-- footer -->
  <text x="58" y="919" class="hint">需求由你下发；产品经理→UI 设计→开发→测试→AI 验收复核→你确认→运维发布。</text>
  <text x="58" y="933" class="hint">每个阶段的角色边界写在派发提示词里，评审由你在面板上把关。</text>
  <text x="58" y="952" class="hint" style="fill:#a2a8b3">真正的多角色执行由 Lead 用 spawn_teammate / team_task_* 组织；</text>
  <text x="58" y="966" class="hint" style="fill:#a2a8b3">本面板只维护阶段状态、产物与人工闸门。</text>
  <text x="58" y="990" class="tiny" style="fill:#b6bdc7">normal 模式 · 第 1 轮 · 验收复核卡的「AI 复核」标签为信息蓝</text>

  <!-- ======================= ANNOTATION ======================= -->
  <text x="470" y="122" class="h1">设计稿 A · normal 模式：验收复核待评审</text>
  <text x="470" y="148" class="h2">AI 复核给建议、你拍板；第 5 关待评审时，第 6/7 关保持锁定。</text>

  <text x="470" y="184" class="sec">双复核关系 · ACCEPTANCE → APPROVAL → RELEASE</text>

  <!-- dual review diagram -->
  <rect x="470" y="196" width="210" height="112" rx="8" fill="#f4f8ff" stroke="#cfdcf5"/>
  <text x="486" y="220" style="font-size:10.5px;font-weight:700;fill:#0f1115">第 5 关 · 验收复核</text>
  <text x="486" y="238" style="font-size:9px;font-weight:600;fill:#4176e6">项目经理 Agent · AI 复核</text>
  <text x="486" y="257" class="anno" style="font-size:9.5px">查全 / 查实 / 留证据</text>
  <text x="486" y="271" class="anno" style="font-size:9.5px">给建议（建议放行 / 打回）</text>
  <rect x="486" y="281" width="46" height="15" rx="7.5" fill="#fef5e7"/>
  <text x="509" y="292" text-anchor="middle" class="pill" style="font-size:8.5px" fill="#b7791f">待评审</text>

  <rect x="750" y="196" width="210" height="112" rx="8" fill="#ffffff" stroke="#d5dae1"/>
  <text x="766" y="220" style="font-size:10.5px;font-weight:700;fill:#0f1115">第 6 关 · 人工确认</text>
  <text x="766" y="238" style="font-size:9px;font-weight:600;fill:#0f1115">项目经理（你）· 人工确认</text>
  <text x="766" y="257" class="anno" style="font-size:9.5px">拍板：通过 / 打回</text>
  <text x="766" y="271" class="anno" style="font-size:9.5px">AI 报告是输入，不替代你</text>
  <rect x="766" y="281" width="54" height="15" rx="7.5" fill="#f1f3f5"/>
  <text x="793" y="292" text-anchor="middle" class="pill" style="font-size:8.5px" fill="#8a919c">锁定中</text>

  <rect x="1030" y="196" width="210" height="112" rx="8" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="1046" y="220" style="font-size:10.5px;font-weight:700;fill:#0f1115">第 7 关 · 发布上线</text>
  <text x="1046" y="238" style="font-size:9px;fill:#8a919c">运维</text>
  <text x="1046" y="257" class="anno" style="font-size:9.5px">仅人工确认通过后启动</text>
  <text x="1046" y="271" class="anno" style="font-size:9.5px">发布记录 + 回滚方案</text>
  <rect x="1046" y="281" width="46" height="15" rx="7.5" fill="#f1f3f5"/>
  <text x="1069" y="292" text-anchor="middle" class="pill" style="font-size:8.5px" fill="#8a919c">锁定</text>

  <line x1="684" y1="252" x2="742" y2="252" stroke="#b6bdc7" stroke-width="1.5"/>
  <polygon points="750,252 741,247 741,257" fill="#b6bdc7"/>
  <text x="714" y="230" text-anchor="middle" class="tiny">建议</text>
  <text x="714" y="243" text-anchor="middle" class="tiny">放行 / 打回</text>
  <line x1="964" y1="252" x2="1022" y2="252" stroke="#b6bdc7" stroke-width="1.5"/>
  <polygon points="1030,252 1021,247 1021,257" fill="#b6bdc7"/>
  <text x="994" y="230" text-anchor="middle" class="tiny">通过后</text>
  <text x="994" y="243" text-anchor="middle" class="tiny">解锁</text>
  <text x="470" y="330" class="sum">两道关都过，release 才能启动；normal 与 fast 下 approval / release 都不会自动通过。</text>

  <text x="470" y="366" class="sec">验收复核卡要点</text>
  <text x="470" y="392" class="anno">① 标签「AI 复核」+ 角色「项目经理 Agent」：与第 6 关「人工确认 + 项目经理（你）」成对，冷蓝 vs 中性深色。</text>
  <text x="470" y="414" class="anno">② 摘要三要素：结论（建议放行/打回）· 阻断项数量 · 复测结果，先看结论再看报告。</text>
  <text x="470" y="436" class="anno">③ 产物固定第一项「验收复核报告」docs/pipeline/acceptance-review.md，点开即读；证据缩略图随后。</text>
  <text x="470" y="458" class="anno">④ 动作随状态：待开始→启动并派发；进行中→发送角色提示；待评审→通过/打回；已打回→重新派发。</text>
  <text x="470" y="480" class="anno">⑤ 锁定：acceptance 未通过时 approval 启动禁用、release 更远一层；fast 也不自动通过这两关。</text>

  <text x="470" y="520" class="sec">NORMAL 主路径</text>
  <rect x="470" y="536" width="160" height="54" rx="6" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="482" y="557" class="stage" style="font-size:10px">testing 已通过</text>
  <text x="482" y="574" class="tiny">第 4 关 approved</text>
  <line x1="634" y1="563" x2="662" y2="563" stroke="#b6bdc7" stroke-width="1.5"/>
  <polygon points="670,563 661,558 661,568" fill="#b6bdc7"/>
  <rect x="674" y="536" width="170" height="54" rx="6" fill="#ffffff" stroke="#e3e8ef"/>
  <text x="686" y="557" class="stage" style="font-size:10px">acceptance 进行中</text>
  <text x="686" y="574" class="tiny">项目经理 Agent 复核</text>
  <line x1="848" y1="563" x2="876" y2="563" stroke="#b6bdc7" stroke-width="1.5"/>
  <polygon points="884,563 875,558 875,568" fill="#b6bdc7"/>
  <rect x="888" y="536" width="190" height="54" rx="6" fill="#ffffff" stroke="#f0b74a"/>
  <text x="900" y="557" class="stage" style="font-size:10px">待评审 → 你审批</text>
  <text x="900" y="574" class="tiny">通过解锁 approval；打回变 failed</text>
  <text x="470" y="612" class="anno">通过 → approval 解锁 → 你人工确认 → release 解锁；打回 → failed（红备注）→ 重新派发 → 修复后重走。</text>

  <!-- callouts aligned with card rows -->
  <text x="470" y="648" class="annob">① 标签 + 角色：AI 复核 / 项目经理 Agent</text>
  <line x1="444" y1="644" x2="462" y2="644" stroke="#4176e6" stroke-width="1"/>
  <circle cx="444" cy="644" r="2.5" fill="#4176e6"/>

  <text x="470" y="674" class="annob">② 摘要：建议放行 · 阻断项 0 · 复测 3/3</text>
  <line x1="444" y1="670" x2="462" y2="670" stroke="#8a919c" stroke-width="1"/>
  <circle cx="444" cy="670" r="2.5" fill="#8a919c"/>

  <text x="470" y="702" class="annob">③ 产物：验收复核报告可点开</text>
  <line x1="444" y1="698" x2="462" y2="698" stroke="#8a919c" stroke-width="1"/>
  <circle cx="444" cy="698" r="2.5" fill="#8a919c"/>

  <text x="470" y="730" class="annob">④ 通过 / 打回（normal 待评审才出现）</text>
  <line x1="444" y1="726" x2="462" y2="726" stroke="#8a919c" stroke-width="1"/>
  <circle cx="444" cy="726" r="2.5" fill="#8a919c"/>

  <text x="470" y="784" class="annob">⑤ approval 未解锁：启动按钮禁用 + 序列提示</text>
  <line x1="444" y1="780" x2="462" y2="780" stroke="#8a919c" stroke-width="1"/>
  <circle cx="444" cy="780" r="2.5" fill="#8a919c"/>

  <text x="470" y="872" class="annob">⑥ release 锁定：approval 通过后才解锁</text>
  <line x1="444" y1="868" x2="462" y2="868" stroke="#8a919c" stroke-width="1"/>
  <circle cx="444" cy="868" r="2.5" fill="#8a919c"/>

  <!-- legend -->
  <text x="470" y="922" class="sec">颜色与语义</text>
  <rect x="470" y="936" width="10" height="10" rx="2" fill="#4176e6"/>
  <text x="486" y="945" class="legend">AI 复核（信息蓝）</text>
  <rect x="630" y="936" width="10" height="10" rx="2" fill="#0f1115"/>
