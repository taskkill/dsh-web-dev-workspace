  <text x="64" y="523" class="sum">7 阶段常量、迁移与闸门逻辑；npm test 全绿</text>
  <text x="64" y="534" class="check">✓ 已通过</text>

  <!-- stage 4 -->
  <rect x="56" y="544" width="376" height="60" rx="7" fill="#ffffff" stroke="#e3e8ef"/>
  <circle cx="71" cy="561" r="8" fill="#f1f3f5"/>
  <text x="71" y="564" text-anchor="middle" class="tiny" style="fill:#61666b">4</text>
  <text x="85" y="562" class="stage">测试验收</text>
  <text x="85" y="574" class="role">测试工程师</text>
  <rect x="368" y="553" width="56" height="15" rx="7.5" fill="#f1f3f5"/>
  <text x="396" y="564" text-anchor="middle" class="pill" fill="#1a9e4b">已通过</text>
  <text x="64" y="589" class="sum">42 项验收全 pass，无 fail/blocked；测试报告已出</text>
  <text x="64" y="600" class="check">✓ 已通过</text>

  <!-- stage 5 : acceptance review -->
  <rect x="56" y="610" width="376" height="128" rx="7" fill="#ffffff" stroke="#f0b74a" stroke-width="1.5"/>
  <circle cx="71" cy="627" r="8" fill="#f1f3f5"/>
  <text x="71" y="630" text-anchor="middle" class="tiny" style="fill:#61666b">5</text>
  <text x="85" y="629" class="stage">验收复核</text>
  <text x="85" y="641" class="role">项目经理 Agent</text>
  <rect x="157" y="632" width="44" height="14" rx="7" fill="#eaf1fd"/>
  <text x="179" y="642" text-anchor="middle" class="tag" fill="#4176e6">AI 复核</text>
  <rect x="360" y="619" width="64" height="15" rx="7.5" fill="#f1f3f5"/>
  <text x="392" y="630" text-anchor="middle" class="pill" fill="#b7791f">待评审</text>
  <text x="64" y="660" class="sum">建议放行 · 阻断项 0 · 复测 3/3 通过（npm test）</text>
  <text x="64" y="675" class="sum">需求覆盖 9/9，验收清单 42 项 pass，DoD 七项已核对。</text>
  <text x="64" y="695" class="link">验收复核报告</text>
  <text x="124" y="695" class="tiny" style="font-size:9px">docs/pipeline/acceptance-review.md</text>
  <rect x="64" y="704" width="52" height="22" rx="5" fill="#0f1115"/>
  <text x="90" y="719" text-anchor="middle" style="font-size:10px;font-weight:600;fill:#ffffff">通过</text>
  <rect x="122" y="704" width="52" height="22" rx="5" fill="#ffffff" stroke="#d5dae1"/>
  <text x="148" y="719" text-anchor="middle" style="font-size:10px;font-weight:600;fill:#0f1115">打回</text>

  <!-- stage 6 : human sign-off (locked) -->
  <rect x="56" y="744" width="376" height="84" rx="7" fill="#ffffff" stroke="#e3e8ef"/>
  <circle cx="71" cy="761" r="8" fill="#f1f3f5"/>
  <text x="71" y="764" text-anchor="middle" class="tiny" style="fill:#61666b">6</text>
  <text x="85" y="763" class="stage">人工确认</text>
  <text x="85" y="775" class="role">项目经理（你）</text>
  <rect x="169" y="766" width="48" height="14" rx="7" fill="#eceef1"/>
  <text x="193" y="776" text-anchor="middle" class="tag" fill="#0f1115">人工确认</text>
  <rect x="370" y="753" width="54" height="15" rx="7.5" fill="#f1f3f5"/>
